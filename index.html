<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free crossword and word search sheets for teachers. Print one page, or open the PDF in Canva."
    />
    <title>EduTools</title>
    <script>
      try {
        var storedTheme = localStorage.getItem('edutools-theme')
        var useDark = storedTheme === 'dark' || (storedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (useDark) document.documentElement.classList.add('dark')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
